<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PocketBase · BitPanel</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #fafafa; color: #111827;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #030712; color: #f3f4f6; }
        a.card { border-color: #1f2937 !important; }
        a.card:hover { background: #111827 !important; }
        .muted { color: #9ca3af !important; }
      }
      main { max-width: 30rem; padding: 2rem 1.5rem; }
      h1 { font-size: 1.35rem; margin: 0 0 .35rem; font-weight: 600; }
      .muted { color: #6b7280; margin: 0 0 1.5rem; }
      a.card {
        display: block; padding: .85rem 1rem; margin-bottom: .6rem;
        border: 1px solid #e5e7eb; border-radius: .65rem;
        text-decoration: none; color: inherit; transition: background .15s ease;
      }
      a.card:hover { background: #f3f4f6; }
      code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: .85em; }
    </style>
  </head>
  <body>
    <main>
      <h1>PocketBase</h1>
      <p class="muted">
        Shared database for BitPanel projects. There is nothing at this root path —
        pick a destination:
      </p>
      <a class="card" href="/_/">
        <strong>Admin dashboard</strong><br />
        <span class="muted">Collections, records, settings and backups</span>
      </a>
      <a class="card" href="/api/health">
        <strong>Health endpoint</strong><br />
        <span class="muted"><code>/api/health</code> — used by the panel</span>
      </a>
      <p class="muted" style="margin-top:1.5rem">
        Apps on the phone connect at <code>http://127.0.0.1:8090</code>.
      </p>
    </main>
  </body>
</html>
